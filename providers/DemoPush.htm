<script type="text/javascript">
    var $ = jQuery

    var gameTpl = document.getElementById('gameTpl').innerText
    var gameTpl_greentube = document.getElementById('gameTpl_greentube').innerText
    var defaultLabel = "OFFLINE"


    window.addEventListener("load", function load(event){

        loadGames()



    },false);

    var gamesMap = {}
    var gamesArray = []


    function isMobile(){
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
    }

    function loadGames(){
        //$.get('//partners.casinomobule.com/games.list', function(r){
$.get('/games-hash-9b2da2.json', function(r){
            gamesArray = sort(r)
            gamesMap = {}

            $("#blockGames").empty()
	    show()	
	})
    }

function icon(game){
   return 'https://cdn.effective-solution.com/CasinoMobule/'+game.provider+'/156-156/' + game.alias + '.png';


   if(game.icon && (game.icon.substr(0,2) == '//' || game.icon.substr(0,4) == 'http')){
	return game.icon;
   }else if(game.provider == 'netent'){
        return '//shared-static.casinomobule.com/media/netent/thumbs/500x332/'+game.icon+'.png';
}else if(game.provider == 'greentube'){
	//return '//shared-static.casinomobule.com/media/greentube/icons/190x190/jpg/'+game.alias+'.jpg';
return '//shared-static.casinomobule.com/media/greentube/icons/376x376/'+game.alias+'.png'
}else{
return 'not implemented';
}
	
}

    function show(fn){

try {
            var items = []
	    var providerSelected = document.getElementById('fProvider').value	

            for(var i=0; i < gamesArray.length; i++){
                var game = gamesArray[i]

if(!game.is_enabled) continue;

                gamesMap[game.id] = game

                var o = {}
                for(var k in game){ o[k] =game[k] }


                var display = (game.is_enabled ? "none" : "block")
                var label = defaultLabel

                if(game.desktop_enabled ==false && !isMobile()){
                    label = "ONLY MOBILE"
                    display = "block"
                }else if(game.mobile_enabled == false && isMobile()){
                    label = "ONLY DESKTOP"
                    display = "block"
                }

                o.href = "start("+game.id+")"
                o.display = display
                o.label = label
o.icon = icon(game);

		var item;

		if(game.provider == 'greentube'){
			item = template(gameTpl_greentube, o)
		}else{
	                item = template(gameTpl,o)
		}

		if(providerSelected == '*' || providerSelected == game.provider || (providerSelected == 'megaways' && (game.title.toLowerCase().indexOf('megaways') > 0))){
if(fn){
if(fn(game)) items.push(item);
}else{
items.push(item);
}
		}
            }

            document.getElementById('blockGames').innerHTML = items.join("\n")
}catch(e){
	console.error("Err while rendering games")
console.error(e)
}
    }

function start(id){
var game = gamesMap[id]
var mobile = isMobile() ? 'true' : 'false';
var lang = document.getElementById('fLang').value
var domain = (game.provider=='spribe' || game.provider =='pgsoft11') ? 'https://partners.casinomobule.com' : 'https://test.partners.casinomobule.com'
var curr = $('#fCurrency').val()
var _bal=parseFloat(localStorage.getItem('z51_balance'));if(isNaN(_bal)||_bal<=0){_bal=100;localStorage.setItem('z51_balance',100);}
var start_url = domain + '/games.startDemo?partner.alias=demo&game.alias='+game.alias+'&game.provider='+game.provider+'&currency='+curr+'&mobile='+mobile+'&balance='+Math.round(_bal*100)+'&origin=true&lang='+lang +'&lobby_url='+encodeURIComponent(window.location.href)

if(isMobile()){
	window.location=start_url;
}else{
                document.getElementById('game').src=start_url;

                $('#gameWindow').css('display','block')
                $('body').css('overflow','hidden')
}
}

function start_with_lang(game, lang){
    var mobile = isMobile() ? 'true' : 'false';
    var domain = (game.provider=='spribe' || game.provider =='pgsoft11') ? 'https://partners.casinomobule.com' : 'https://test.partners.casinomobule.com'
    var curr = $('#fCurrency').val()
    var _bal=parseFloat(localStorage.getItem('z51_balance'));if(isNaN(_bal)||_bal<=0){_bal=100;localStorage.setItem('z51_balance',100);}
    var start_url = domain + '/games.startDemo?partner.alias=demo&game.alias='+game.alias+'&game.provider='+game.provider+'&currency='+curr+'&mobile='+mobile+'&balance='+Math.round(_bal*100)+'&origin=true&lang='+lang +'&lobby_url='+encodeURIComponent(window.location.href)

    if(isMobile()){
        window.location=start_url;
    }else{
        document.getElementById('game').src=start_url;

        $('#gameWindow').css('display','block')
        $('body').css('overflow','hidden')
    }
}


    function start_old(id){

        var lang = document.getElementById('fLang').value

        var game = gamesMap[id]


	if(game.provider == 'greentube'){
		var start_url = 'https://test.partners.casinomobule.com/games.startDemo?partner.alias=demo&game.alias='+game.alias+'&game.provider='+game.provider+'&currency=RUB&mobile=false&balance=100000&origin=true&lang='+lang 
                document.getElementById('game').src=start_url;

		$('#gameWindow').css('display','block')
	        $('body').css('overflow','hidden')
        }else{

	var domain = (game.provider=='spribe') ? '//partners.casinomobule.com' : '//test.partners.casinomobule.com'

        $.get(
            domain + '/netent.generateDemoStartConfig',
            {
                'partner.alias' : 'demo',
		'game.provider': game.provider,
                'game.alias': game.alias,
                mobile: isMobile(),
                currency: $('#fCurrency').val(),
		balance: 500000,
		origin: true
            }
        , function(r){

                if(r.status == 200){
	                    startFromConfig(r.response)
                }else{
                    alert("Error: "+r.message)
                }
            })
	}
    }

    function startFromConfig(config){

        $('#gameWindow').css('display','block')
        $('body').css('overflow','hidden')


        config.language = document.getElementById('fLang').value
        //config.mobileParams.lobbyURL = "http://google.com"
config.mobileParams.lobbyURL = "https://copyslots.com/"

        console.log("@startFromConfig")
        console.log(config)

        netent.launch(
            config,
            function (netEntExtend) {},
            function (e) {
                console.log(e);
            }
        );
    }

    function close(){
        $('#gameWindow').css('display', 'none')
        $('#game').attr('src','')
        $('body').css('overflow','auto')
    }

    function template(text, params){
        var content = text

        for(var key in params){
            content = content.replace(new RegExp("\\{\\$"+key+"\\}","g"), params[key])
        }

        return content;
    }

    function sort(games){
        return games.sort(function(a0,b0){
            var a = a0.title
            var b = b0.title

 	    if(a0.provider == 'spribe'){
		return -1
	    }else if(b0.provider == 'spribe'){
		return 1
	    }else if(a > b){
                return 1
            }else if(a < b){
                return -1
            }else{
                return 0
            }
        })
    }


    function loadCurrencies(){
        $.get(
            '//test.partners.casinomobule.com/currencies.list',
            {
                'partner.alias' : 'demo'
            }
            , function(r){

                var html = ''


                if(r.status == 200){
                    for( var i=0; i < r.response.length; i++){
                        var item = r.response[i]

                        html += '<option value="'+item.code_alpha+'">'+item.code_alpha+' - ' + item.title+'\n'
                    }
                }else{
                    alert("Error: "+r.message)
                }

                $('#fCurrency').html(html)
                $('#fCurrency').val('EUR')

            })
    }

    loadCurrencies()


var lastsearch = null;

$('#fSearch').on('keyup', (e) => { 

 var s = $(e.target).val().trim().toLowerCase();

if(s == lastsearch) return;
lastsearch = s;
 
show(g => g.title.toLowerCase().indexOf(s) >= 0)
 })

// -- BALANCE SYNC FROM GAME IFRAME --
window.addEventListener('message', function(e) {
  var data = e.data;
  if (typeof data === 'string') { try { data = JSON.parse(data); } catch(err) {} }
  if (!data || typeof data !== 'object') return;
  if (data.event === 'gameChangeCash' && Array.isArray(data.data) && typeof data.data[0] === 'number') {
    localStorage.setItem('z51_balance', Math.max(0, data.data[0] / 100).toFixed(2)); return;
  }
  function num(v) {
    if (typeof v === 'number' && v >= 0) return v;
    if (typeof v === 'string') { var n = parseFloat(v); if (!isNaN(n) && n >= 0) return n; }
    return null;
  }
  function findBalance(obj, depth) {
    if (!obj || typeof obj !== 'object' || depth > 4) return null;
    for (var k in obj) { if (k.toLowerCase().indexOf('balance') !== -1) { var v = num(obj[k]); if (v !== null) return v; } }
    for (var k2 in obj) { if (typeof obj[k2] === 'object') { var f = findBalance(obj[k2], depth + 1); if (f !== null) return f; } }
    return null;
  }
  var cents = findBalance(data, 0);
  if (cents === null && num(data.credits) !== null) cents = num(data.credits);
  if (cents === null && num(data.credit)  !== null) cents = num(data.credit);
  if (cents !== null) { localStorage.setItem('z51_balance', Math.max(0, cents / 100).toFixed(2)); }
});
