<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>ZONE 51 — Binary Decision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../cursor.js"></script>
  <style>
    :root {
      --bg: #060108; --panel: #0c0106; --line: rgba(160,120,40,0.1);
      --text: #bdb5a6; --muted: #524d45;
      --gold: #ff4060; --gold-bright: #ffe600;
      --red-bright: #c4253c; --green-bright: #22a862;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; overflow: hidden; }

    /* TOPBAR */
    .topbar {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; border-bottom: 1px solid var(--line);
      background: rgba(3,3,5,0.97); position: relative; z-index: 10;
    }
    .topbar::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 5%, var(--gold) 50%, transparent 95%); opacity: 0.35;
    }
    .tb-left { display: flex; align-items: center; gap: 20px; }
    .back-btn {
      text-decoration: none; color: var(--muted); font-size: 0.72rem;
      letter-spacing: 2px; text-transform: uppercase; padding: 6px 14px;
      border: 1px solid var(--line); transition: all 0.18s;
    }
    .back-btn:hover { color: var(--gold); border-color: rgba(255,30,55,0.5); }
    .game-title { font-family: "Orbitron", sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 5px; }
    .game-title em { color: var(--gold); font-style: normal; }
    .tb-right { display: flex; align-items: center; gap: 24px; }
    .tb-stat { display: flex; flex-direction: column; align-items: flex-end; }
    .tb-lbl { font-size: 0.5rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); opacity: 0.55; }
    .tb-val { font-family: "Orbitron", sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--gold); letter-spacing: 1px; transition: color 0.3s; }
    .tb-val.up   { color: var(--green-bright); }
    .tb-val.down { color: var(--red-bright); }

    /* LAYOUT */
    .wrap {
      height: calc(100vh - 56px);
      display: grid; grid-template-columns: 1fr 340px;
    }

    /* MAIN STAGE */
    .stage {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0; overflow: hidden; position: relative;
      background: #060608;
    }

    /* scanlines */
    .stage::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.022) 2px, rgba(0,0,0,0.022) 4px);
    }

    /* COIN */
    .coin-wrap {
      perspective: 900px;
      width: 220px; height: 220px;
      margin-bottom: 40px; position: relative;
    }
    .coin {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      position: relative;
      transition: none;
    }
    .coin.spin-fast { animation: spin3d 0.19s linear infinite; }
    .coin.spin-mid  { animation: spin3d 0.48s linear infinite; }
    .coin.spin-slow { animation: spin3d 1.1s  linear infinite; }
    .coin.land-heads { animation: landHeads 0.35s ease-out forwards; }
    .coin.land-tails  { animation: landTails  0.35s ease-out forwards; }

    @keyframes spin3d { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
    @keyframes landHeads { from { transform: rotateY(1440deg); } to { transform: rotateY(1440deg); } }
    @keyframes landTails  { from { transform: rotateY(1620deg); } to { transform: rotateY(1620deg); } }

    .coin-face {
      position: absolute; inset: 0; border-radius: 50%;
      backface-visibility: hidden;
      overflow: hidden;
      border: 2px solid;
    }
    .coin-face img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      border-radius: 50%; pointer-events: none; user-select: none;
    }
    .coin-heads {
      background: #000;
      border-color: rgba(255,20,50,0.35);
      box-shadow: 0 0 50px rgba(255,30,55,0.5), 0 0 100px rgba(255,20,50,0.35);
      transform: rotateY(0deg);
    }
    .coin-tails {
      background: #000;
      border-color: rgba(160,150,130,0.35);
      box-shadow: 0 0 30px rgba(100,90,70,0.2), 0 0 60px rgba(100,90,70,0.08);
      transform: rotateY(180deg);
    }

    /* glow ring */
    .coin-glow {
      position: absolute; inset: -12px; border-radius: 50%;
      border: 1px solid rgba(255,20,40,0.1);
      box-shadow: 0 0 60px rgba(255,20,45,0.08);
      pointer-events: none; transition: all 0.3s;
    }
    .coin-glow.win  { border-color: rgba(34,168,98,0.4);  box-shadow: 0 0 80px rgba(34,168,98,0.2); }
    .coin-glow.lose { border-color: rgba(196,37,60,0.35); box-shadow: 0 0 60px rgba(196,37,60,0.15); }

    /* RESULT TEXT */
    .result-text {
      font-family: "Orbitron", sans-serif; font-size: 1.3rem; font-weight: 900;
      letter-spacing: 6px; text-transform: uppercase; min-height: 2rem;
      text-align: center; transition: all 0.3s; opacity: 0;
    }
    .result-text.show { opacity: 1; }
    .result-text.win  { color: var(--green-bright); text-shadow: 0 0 30px rgba(34,168,98,0.5); }
    .result-text.lose { color: var(--red-bright);   text-shadow: 0 0 30px rgba(196,37,60,0.4); }
    .result-sub {
      font-size: 0.72rem; color: var(--muted); letter-spacing: 3px;
      text-transform: uppercase; margin-top: 6px; min-height: 1rem; text-align: center;
      opacity: 0; transition: opacity 0.3s;
    }
    .result-sub.show { opacity: 1; }

    /* SIDE CHOICE */
    .side-row {
      display: flex; gap: 12px; margin-top: 36px;
    }
    .side-btn {
      width: 130px; padding: 14px 10px;
      border: 1px solid; background: transparent; cursor: pointer;
      font-family: "Orbitron", sans-serif; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase; transition: all 0.22s;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .side-coin-img { width: 46px; height: 46px; border-radius: 50%; display: block; pointer-events: none; }
    .side-btn.heads {
      border-color: rgba(255,30,55,0.5); color: rgba(255,40,60,0.9);
    }
    .side-btn.heads.active, .side-btn.heads:hover {
      border-color: var(--gold); color: var(--gold-bright);
      background: rgba(255,20,40,0.09); box-shadow: 0 0 20px rgba(255,20,45,0.14);
    }
    .side-btn.tails {
      border-color: rgba(160,150,130,0.2); color: var(--muted);
    }
    .side-btn.tails.active, .side-btn.tails:hover {
      border-color: rgba(180,170,155,0.5); color: var(--text);
      background: rgba(160,150,130,0.05);
    }

    /* FLIP BUTTON */
    .flip-btn {
      margin-top: 22px;
      width: 270px; padding: 16px; font-family: "Orbitron", sans-serif;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
      border: 1px solid var(--gold); background: rgba(255,20,45,0.14);
      color: var(--gold-bright); cursor: pointer; transition: all 0.18s;
    }
    .flip-btn:hover:not(:disabled) { background: rgba(255,30,55,0.4); box-shadow: 0 0 30px rgba(255,20,50,0.35); }
    .flip-btn:disabled { border-color: var(--line); background: transparent; color: var(--muted); cursor: not-allowed; }

    /* STREAK */
    .streak-row {
      display: flex; align-items: center; gap: 6px; margin-top: 20px;
    }
    .streak-dot {
      width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line);
      background: rgba(255,255,255,0.04); transition: all 0.2s;
    }
    .streak-dot.win  { background: var(--green-bright); border-color: var(--green-bright); box-shadow: 0 0 7px rgba(34,168,98,0.5); }
    .streak-dot.lose { background: var(--red-bright);   border-color: var(--red-bright);   box-shadow: 0 0 7px rgba(196,37,60,0.4); }

    /* ODDS DISPLAY */
    .odds-strip {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 24px; opacity: 0.4;
    }
    .odds-item { text-align: center; }
    .odds-lbl { font-size: 0.5rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }
    .odds-val { font-family: "Orbitron", sans-serif; font-size: 0.78rem; color: var(--text); margin-top: 2px; }

    /* RIGHT PANEL */
    .right-panel {
      border-left: 1px solid var(--line); background: rgba(3,3,5,0.85);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .panel-sec { padding: 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .panel-lbl { font-size: 0.52rem; letter-spacing: 3.5px; text-transform: uppercase; color: var(--muted); opacity: 0.45; margin-bottom: 10px; }

    /* BET */
    .ctrl-lbl { font-size: 0.52rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); opacity: 0.55; display: block; margin-bottom: 6px; }
    .bet-row { display: flex; }
    .bet-adj {
      width: 30px; background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      color: var(--muted); font-size: 1rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all 0.15s;
    }
    .bet-adj:hover { color: var(--gold); border-color: rgba(255,30,55,0.5); }
    .bet-input {
      flex: 1; padding: 8px 6px; background: rgba(255,255,255,0.025);
      border: 1px solid var(--line); border-left: none; border-right: none;
      color: var(--text); font-size: 0.9rem; font-family: "Orbitron", sans-serif;
      font-weight: 600; text-align: center; outline: none;
    }
    .bet-input:focus { border-color: rgba(255,30,55,0.55); }
    .bet-presets { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
    .preset {
      padding: 3px 7px; font-size: 0.58rem; border: 1px solid var(--line);
      background: transparent; color: var(--muted); cursor: pointer;
      font-family: "Inter", sans-serif; transition: all 0.15s;
    }
    .preset:hover { color: var(--gold); border-color: rgba(255,30,55,0.5); }

    /* POTENTIAL WIN */
    .potential {
      margin-top: 8px; padding: 10px 12px;
      background: rgba(255,20,50,0.35); border: 1px solid rgba(255,20,40,0.1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .potential .plbl { font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .potential .pval { font-family: "Orbitron", sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--gold); }

    /* STATS */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--line);
    }
    .stat-cell {
      background: var(--panel); padding: 12px 14px;
    }
    .s-lbl { font-size: 0.5rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); opacity: 0.55; margin-bottom: 5px; }
    .s-val { font-family: "Orbitron", sans-serif; font-size: 1rem; font-weight: 700; color: var(--gold); }
    .s-val.pos { color: var(--green-bright); }
    .s-val.neg { color: var(--red-bright); }

    /* HISTORY */
    .hist-scroll { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,20,40,0.1) transparent; }
    .hist-scroll::-webkit-scrollbar { width: 3px; }
    .hist-scroll::-webkit-scrollbar-thumb { background: rgba(255,20,45,0.14); }
    .hist-item {
      display: grid; grid-template-columns: 22px 1fr auto auto;
      gap: 8px; align-items: center;
      padding: 8px 14px; border-bottom: 1px solid rgba(255,20,50,0.35);
      font-size: 0.72rem; transition: background 0.15s;
    }
    .hist-item:hover { background: rgba(255,255,255,0.012); }
    .hist-icon { font-size: 0.9rem; text-align: center; }
    .hist-side { color: var(--text); font-weight: 500; font-size: 0.7rem; }
    .hist-bet  { color: var(--muted); font-size: 0.64rem; }
    .hist-res  { font-family: "Orbitron", sans-serif; font-size: 0.68rem; font-weight: 700; text-align: right; }

    @media (max-width: 700px) {
      html, body { overflow: auto; height: auto; }
      .wrap { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 56px); }
      .right-panel { display: none; }
      .stage { min-height: 320px; padding: 20px 0; }
      .coin-wrap { width: 160px; height: 160px; margin-bottom: 24px; }
      .pick-btns { flex-direction: row; gap: 10px; }
      .pick-btn   { flex: 1; padding: 14px 8px; }
      .topbar { height: 50px; padding: 0 12px; }
      .back-btn { font-size: 0.65rem; padding: 5px 10px; }
      .game-title { font-size: 0.75rem; letter-spacing: 3px; }
    }
    @media (max-width: 400px) {
      .coin-wrap { width: 130px; height: 130px; }
      .tb-right  { display: none; }
      .topbar    { gap: 8px; }
    }
    /* Mobile touch UX */
    a, button, input, label, [role="button"] {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    @media screen and (max-width: 768px) {
      input[type="number"], input[type="text"], select { font-size: max(16px, 1em); }
    }
  </style>
  <script src="../security.js"></script>
<script src="../cursor.js"></script>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <a href="../index.html" class="back-btn">← Lobby</a>
    <div class="game-title">BINARY <em>DECISION</em></div>
  </div>
  <div class="tb-right">
    <div class="tb-stat">
      <div class="tb-lbl">Balance</div>
      <div class="tb-val" id="balance-el">$ 0.00</div>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- STAGE -->
  <div class="stage">

    <div class="coin-wrap" id="coin-wrap">
      <div class="coin-glow" id="coin-glow"></div>
      <div class="coin" id="coin">
        <div class="coin-face coin-heads"><img src="front.png" alt="Heads" draggable="false"></div>
        <div class="coin-face coin-tails"><img src="back.png" alt="Tails" draggable="false"></div>
      </div>
    </div>

    <div class="result-text" id="result-text"></div>
    <div class="result-sub"  id="result-sub"></div>

    <div class="side-row">
      <button class="side-btn heads active" data-side="heads">
        <img class="side-coin-img" src="front.png" alt="heads">
        Heads
      </button>
      <button class="side-btn tails" data-side="tails">
        <img class="side-coin-img" src="back.png" alt="tails">
        Tails
      </button>
    </div>

    <button class="flip-btn" id="flip-btn">Flip Coin</button>

    <div class="streak-row" id="streak-row">
      <div class="streak-dot"></div>
      <div class="streak-dot"></div>
      <div class="streak-dot"></div>
      <div class="streak-dot"></div>
      <div class="streak-dot"></div>
      <div class="streak-dot"></div>
      <div class="streak-dot"></div>
      <div class="streak-dot"></div>
    </div>

    <div class="odds-strip">
      <div class="odds-item"><div class="odds-lbl">Multiplier</div><div class="odds-val">×1.96</div></div>
      <div class="odds-item"><div class="odds-lbl">House edge</div><div class="odds-val">2%</div></div>
      <div class="odds-item"><div class="odds-lbl">Win chance</div><div class="odds-val">50%</div></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <div class="panel-sec">
      <span class="ctrl-lbl">Bet Amount</span>
      <div class="bet-row">
        <button class="bet-adj" id="bet-minus">−</button>
        <input type="number" class="bet-input" id="bet-input" value="10" min="1">
        <button class="bet-adj" id="bet-plus">+</button>
      </div>
      <div class="bet-presets">
        <button class="preset" data-v="1">$1</button>
        <button class="preset" data-v="5">$5</button>
        <button class="preset" data-v="10">$10</button>
        <button class="preset" data-v="25">$25</button>
        <button class="preset" data-v="50">$50</button>
        <button class="preset" data-v="100">$100</button>
        <button class="preset" data-v="half">½</button>
        <button class="preset" data-v="double">×2</button>
      </div>
      <div class="potential">
        <span class="plbl">Potential Win</span>
        <span class="pval" id="pot-val">$ 19.60</span>
      </div>
    </div>

    <div class="panel-sec">
      <div class="panel-lbl">Session Stats</div>
      <div class="stats-grid">
        <div class="stat-cell"><div class="s-lbl">Flips</div><div class="s-val" id="s-flips">0</div></div>
        <div class="stat-cell"><div class="s-lbl">Win rate</div><div class="s-val" id="s-rate">—</div></div>
        <div class="stat-cell"><div class="s-lbl">Best win</div><div class="s-val pos" id="s-best">—</div></div>
        <div class="stat-cell"><div class="s-lbl">P&amp;L</div><div class="s-val" id="s-pnl">$ 0</div></div>
      </div>
    </div>

    <div class="panel-lbl" style="padding:12px 16px 6px;flex-shrink:0;">Flip History</div>
    <div class="hist-scroll">
      <div id="hist-list"></div>
    </div>
  </div>

</div>

<script>
  const MULT = 1.96;

  const _Z51_BAL_KEY = 'z51_balance';
  function _z51ReadBal() { var v = parseFloat(localStorage.getItem(_Z51_BAL_KEY)); return (isNaN(v)) ? 0 : v; }
  let balance = _z51ReadBal();
  let chosen  = 'heads';
  let flipping = false;
  let streak  = [];          // last 8 results: 'win'|'lose'
  let sFlips = 0, sWins = 0, sPnl = 0, sBest = 0;
  let histData = [];

  /* ── UI refs ── */
  const balEl      = document.getElementById('balance-el');
  const flipBtn    = document.getElementById('flip-btn');
  const resultText = document.getElementById('result-text');
  const resultSub  = document.getElementById('result-sub');
  const coinEl     = document.getElementById('coin');
  const glowEl     = document.getElementById('coin-glow');

  /* ── BALANCE ── */
  function setBalance(v, up) {
    balance = v;
    localStorage.setItem(_Z51_BAL_KEY, balance.toFixed(2));
    balEl.textContent = `$ ${balance.toFixed(2)}`;
    balEl.classList.remove('up','down');
    void balEl.offsetWidth;
    balEl.classList.add(up ? 'up' : 'down');
    setTimeout(() => balEl.classList.remove('up','down'), 700);
  }

  /* ── POTENTIAL WIN ── */
  function updatePot() {
    const b = parseFloat(document.getElementById('bet-input').value) || 0;
    document.getElementById('pot-val').textContent = `$ ${(b * MULT).toFixed(2)}`;
  }

  /* ── SESSION ── */
  function updateSession() {
    document.getElementById('s-flips').textContent = sFlips;
    document.getElementById('s-rate').textContent  = sFlips > 0 ? Math.round(sWins / sFlips * 100) + '%' : '—';
    document.getElementById('s-best').textContent  = sBest > 0 ? `$ ${sBest.toFixed(2)}` : '—';
    const pnlEl = document.getElementById('s-pnl');
    pnlEl.textContent = (sPnl >= 0 ? '+' : '') + `$ ${sPnl.toFixed(2)}`;
    pnlEl.className = 's-val' + (sPnl > 0 ? ' pos' : sPnl < 0 ? ' neg' : '');
  }

  /* ── STREAK DOTS ── */
  function updateStreak() {
    const dots = document.querySelectorAll('.streak-dot');
    dots.forEach((d, i) => {
      const r = streak[i];
      d.className = 'streak-dot' + (r ? ' ' + r : '');
    });
  }

  /* ── HISTORY ── */
  function pushHistory(side, bet, won, pnl) {
    histData.unshift({ side, bet, won, pnl });
    if (histData.length > 60) histData.pop();
    const el = document.getElementById('hist-list');
    el.innerHTML = histData.map(d => `
      <div class="hist-item">
        <div class="hist-icon"><img src="${d.side === 'heads' ? 'front' : 'back'}.png" style="width:20px;height:20px;border-radius:50%;display:block;" draggable="false"></div>
        <div class="hist-side">${d.side === 'heads' ? 'Heads' : 'Tails'}</div>
        <div class="hist-bet">$${d.bet.toFixed(0)}</div>
        <div class="hist-res" style="color:${d.won ? 'var(--green-bright)' : 'var(--red-bright)'}">
          ${d.won ? '+' : '−'}$${Math.abs(d.pnl).toFixed(2)}
        </div>
      </div>`).join('');
  }

  /* ── FLIP ── */
  function doFlip() {
    if (flipping) return;
    const bet = parseFloat(document.getElementById('bet-input').value) || 0;
    if (bet < 1 || bet > balance) {
      document.getElementById('bet-input').style.borderColor = 'var(--red-bright)';
      setTimeout(() => document.getElementById('bet-input').style.borderColor = '', 900);
      return;
    }

    flipping = true;
    flipBtn.disabled = true;

    /* deduct bet */
    setBalance(balance - bet, false);

    /* clear result */
    resultText.className = 'result-text';
    resultSub.className  = 'result-sub';
    glowEl.className     = 'coin-glow';

    /* RNG */
    const outcome = Math.random() < 0.5 ? 'heads' : 'tails';
    const won     = outcome === chosen;

    /* spinning animation — fast → mid → slow → land */
    coinEl.className = 'coin spin-fast';

    setTimeout(() => {
      coinEl.className = 'coin spin-mid';
      setTimeout(() => {
        coinEl.className = 'coin spin-slow';
        setTimeout(() => {
          coinEl.className = 'coin ' + (outcome === 'heads' ? 'land-heads' : 'land-tails');

          setTimeout(() => {
        /* result */
        const payout = won ? bet * MULT : 0;
        const pnl    = won ? payout - bet : -bet;
        if (won) setBalance(balance + payout, true);

        sFlips++; if (won) sWins++;
        sPnl += pnl;
        if (won && payout > sBest) sBest = payout;

        streak.unshift(won ? 'win' : 'lose');
        if (streak.length > 8) streak.pop();

        resultText.textContent = won ? 'SIGNAL CONFIRMED' : 'SIGNAL LOST';
        resultText.className   = 'result-text show ' + (won ? 'win' : 'lose');
        resultSub.textContent  = won
          ? `+$ ${(payout - bet).toFixed(2)}  at ×${MULT}`
          : `−$ ${bet.toFixed(2)}  — ${outcome.toUpperCase()}`;
        resultSub.className = 'result-sub show';
        glowEl.className    = 'coin-glow ' + (won ? 'win' : 'lose');

        pushHistory(chosen, bet, won, pnl);
        updateSession();
        updateStreak();

        flipping = false;
        flipBtn.disabled = false;
      }, 350);

        }, 1800);   // spin-slow phase
      }, 1200);     // spin-mid phase
    }, 4500);       // spin-fast phase
  }

  /* ── CONTROLS ── */
  flipBtn.addEventListener('click', doFlip);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.target.matches('input')) { e.preventDefault(); doFlip(); }
  });

  document.querySelectorAll('.side-btn').forEach(b => {
    b.addEventListener('click', () => {
      chosen = b.dataset.side;
      document.querySelectorAll('.side-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  const betInputEl = document.getElementById('bet-input');
  betInputEl.addEventListener('input', updatePot);
  document.getElementById('bet-minus').addEventListener('click', () => {
    const steps = [1,2,5,10,25,50,100,200,500];
    const cur = parseFloat(betInputEl.value) || 1;
    const v = [...steps].reverse().find(s => s < cur) || 1;
    betInputEl.value = v; updatePot();
  });
  document.getElementById('bet-plus').addEventListener('click', () => {
    const steps = [1,2,5,10,25,50,100,200,500];
    const cur = parseFloat(betInputEl.value) || 1;
    const v = Math.min(steps.find(s => s > cur) || 500, balance);
    betInputEl.value = v; updatePot();
  });
  document.querySelectorAll('.preset').forEach(b => {
    b.addEventListener('click', () => {
      let v;
      if (b.dataset.v === 'half')   v = Math.max(1, Math.floor((parseFloat(betInputEl.value)||1) / 2));
      else if (b.dataset.v === 'double') v = Math.min((parseFloat(betInputEl.value)||1) * 2, balance);
      else v = parseFloat(b.dataset.v);
      betInputEl.value = v; updatePot();
    });
  });

  updatePot();
  updateStreak();
</script>

  <script src="../sound.js"></script>
  <script src="../loader.js"></script>
