<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>ZONE 51 — 404</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="cloak.js"></script>
  <script src="cursor.js"></script>
  <script src="security.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", sans-serif;
      background: #060108;
      color: #fff5f5;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    .wrap {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 40px 24px;
      max-width: 540px;
    }

    /* ── Big glitch 404 ── */
    .err-code {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 900;
      letter-spacing: 8px;
      color: #ff2244;
      text-shadow:
        0 0 30px rgba(255,34,68,0.7),
        0 0 80px rgba(255,34,68,0.3),
        0 0 160px rgba(255,20,50,0.15);
      line-height: 1;
      margin-bottom: 8px;
      animation: glitch 4s infinite;
      position: relative;
    }

    .err-code::before,
    .err-code::after {
      content: "404";
      position: absolute;
      left: 0; right: 0;
      top: 0;
    }
    .err-code::before {
      color: rgba(0, 255, 200, 0.45);
      animation: glitch-a 4s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }
    .err-code::after {
      color: rgba(255, 60, 20, 0.45);
      animation: glitch-b 4s infinite;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }

    @keyframes glitch {
      0%,95%,100% { transform: translate(0); }
      96% { transform: translate(-3px, 1px); }
      97% { transform: translate(3px, -1px); }
      98% { transform: translate(-1px, 2px); }
      99% { transform: translate(1px, -2px); }
    }
    @keyframes glitch-a {
      0%,95%,100% { transform: translate(0); }
      96% { transform: translate(-6px, 0); }
      97% { transform: translate(6px, 0); }
      98% { transform: translate(0); }
    }
    @keyframes glitch-b {
      0%,95%,100% { transform: translate(0); }
      96% { transform: translate(6px, 0); }
      97% { transform: translate(-6px, 0); }
      98% { transform: translate(0); }
    }

    /* ── Signal lost label ── */
    .err-label {
      font-family: "Orbitron", sans-serif;
      font-size: 0.62rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255, 34, 68, 0.55);
      margin-bottom: 28px;
    }

    /* ── Border box ── */
    .err-card {
      border: 1px solid rgba(255, 30, 55, 0.3);
      border-radius: 4px;
      padding: 28px 32px 32px;
      background: rgba(15, 5, 20, 0.85);
      backdrop-filter: blur(16px);
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .err-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 30, 55, 0.6), rgba(255, 200, 0, 0.4), rgba(255, 30, 55, 0.6), transparent);
    }

    .err-title {
      font-family: "Orbitron", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 12px;
    }

    .err-text {
      font-size: 0.8rem;
      color: rgba(200, 170, 190, 0.65);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .err-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .err-btn {
      font-family: "Inter", sans-serif;
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 22px;
      height: 38px;
      border-radius: 0;
      border: 1px solid;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }
    .err-btn-primary {
      border-color: rgba(255, 196, 0, 0.6);
      background: rgba(255, 20, 45, 0.1);
      color: #ffe600;
    }
    .err-btn-primary:hover {
      background: rgba(255, 20, 50, 0.3);
      border-color: #ffe600;
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.2);
    }
    .err-btn-ghost {
      border-color: rgba(255, 30, 55, 0.35);
      background: transparent;
      color: rgba(255, 60, 80, 0.9);
    }
    .err-btn-ghost:hover {
      border-color: rgba(255, 30, 55, 0.7);
      background: rgba(255, 20, 45, 0.08);
    }

    /* ── Scanlines decoration ── */
    .err-scanlines {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.04) 2px,
        rgba(0, 0, 0, 0.04) 4px
      );
    }

    @media (max-width: 480px) {
      .err-code { font-size: clamp(4rem, 24vw, 6rem); }
      .err-card { padding: 22px 20px 24px; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="err-scanlines"></div>

  <div class="wrap">
    <div class="err-code">404</div>
    <div class="err-label">Signal Lost · Page Not Found</div>
    <div class="err-card">
      <div class="err-title">Transmission Failure</div>
      <p class="err-text">
        The classified file you requested has been wiped, relocated to a
        secure sector, or never existed in our system.
        Your access credentials remain valid — return to base.
      </p>
      <div class="err-btns">
        <a href="index.html" class="err-btn err-btn-primary">&#8962; Return to Base</a>
        <a href="games.html" class="err-btn err-btn-ghost">&#9654; Browse Games</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var c = document.getElementById('stars');
      var ctx = c.getContext('2d');
      var stars = [];
      function resize() { c.width = innerWidth; c.height = innerHeight; }
      function init() {
        stars = [];
        for (var i = 0; i < 180; i++) {
          stars.push({
            x: Math.random() * c.width, y: Math.random() * c.height,
            r: Math.random() * 0.9 + 0.1,
            a: Math.random() * 0.4 + 0.06,
            ph: Math.random() * Math.PI * 2,
            sp: Math.random() * 0.005 + 0.001
          });
        }
      }
      function draw() {
        ctx.clearRect(0, 0, c.width, c.height);
        stars.forEach(function (s) {
          s.ph += s.sp;
          var a = s.a * (0.4 + 0.6 * Math.sin(s.ph));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(195,178,130,' + a + ')';
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      resize(); init(); draw();
      window.addEventListener('resize', function () { resize(); init(); });
    })();
  </script>
  <script src="toast.js"></script>
  <script src="sound.js"></script>
  <script src="loader.js"></script>
</body>
</html>
