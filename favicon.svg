<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- outer border -->
  <rect x="2" y="2" width="60" height="60" fill="#040406" stroke="#c9a84c" stroke-width="2"/>
  <!-- inner border inset -->
  <rect x="8" y="8" width="48" height="48" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <!-- subtle radial glow -->
  <radialGradient id="g" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
  </radialGradient>
  <rect x="2" y="2" width="60" height="60" fill="url(#g)"/>
  <!-- "51" text -->
  <text x="32" y="43" text-anchor="middle"
        font-family="'Orbitron', 'Arial Black', sans-serif"
        font-weight="900" font-size="28" letter-spacing="1"
        fill="#c9a84c">51</text>
</svg>
